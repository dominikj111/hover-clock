[package]
name = "hover-clock"
version = "1.0.0"
edition = "2024"
description = "Transient Linux overlay (GTK4): a clock widget surfaced on demand via hot-corner or global shortcut, above fullscreen apps, without taking focus"
repository = "https://github.com/dominikj111/hover-clock"
rust-version = "1.92"
license = "BSD-3-Clause"

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
gdk4-x11 = "0.11.4"
gio = "0.22"
gtk = { version = "0.11.4", package = "gtk4" }
ureq = { version = "2", default-features = false, features = ["tls"] }
x11rb = { version = "0.14.0", features = ["randr", "xinput"] }

