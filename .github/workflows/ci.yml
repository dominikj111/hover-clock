name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting contract: rustfmt of the MSRV toolchain (1.92.0). Pinned
  # because rustfmt style drifts between versions — local contributors
  # run `cargo +1.92.0 fmt` to match.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable = current toolchain; 1.92.0 = declared MSRV floor
        toolchain: [stable, 1.92.0]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev
      - name: Build
        run: cargo build --locked
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
