name: Release

# Publishing is main-only: pushing a tag like v0.1.0 (created on main)
# builds release binaries for x86_64 and aarch64 and uploads tarballs +
# checksums to the GitHub release page for that tag. The guard job rejects
# tags that do not point at main or whose version does not match
# Cargo.toml (single source of truth).

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # artifact upload/download in the notes <-> build jobs
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main's history — publishing is main-only (dev tags are rejected)."
            exit 1
          fi
      - name: Tag version must match Cargo.toml
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')"
          if [ "$tag_ver" != "$cargo_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_ver — bump Cargo.toml first."
            exit 1
          fi

  # Release notes are generated ONCE here (full history) and passed to
  # both matrix build jobs as an artifact, so the body is deterministic.
  # Generating them inside each build job is what doubled the footer
  # before (see the comment on the upload step).
  notes:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release notes from git history
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          echo "--- generated body ---"
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: [guard, notes]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libgtk4-layer-shell-dev
      - name: Build release
        run: cargo build --release --locked
      - name: Package tarball + checksum
        run: |
          mkdir -p dist
          name="hover-clock-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          tar czf "dist/${name}.tar.gz" -C target/release hover-clock
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .release-notes/
      - name: Upload to release page
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Real per-release notes, generated once in the `notes` job and
          # reused verbatim by both matrix jobs (deterministic). Not
          # `generate_release_notes`: both matrix jobs run this step on
          # the same release, and a second invocation regenerated/appended
          # the notes — for a commit-only repo those are just the "Full
          # Changelog" footer, which ended up doubled on every release
          # page (commit b408829).
          body-path: .release-notes/release-notes.md
